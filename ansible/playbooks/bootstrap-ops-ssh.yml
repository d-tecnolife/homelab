---
- name: Generate the Ops management key
  hosts: ops
  gather_facts: true
  vars:
    ops_git_user_name: Russell
    ops_git_user_email: dtecnolife@proton.me
    repository_authorized_key_files: >-
      {{ query('fileglob', playbook_dir ~ '/../../keys/*.pub') | sort }}

  tasks:
    - name: Read the configured Git name
      ansible.builtin.command:
        argv: [git, config, --global, --get, user.name]
      register: configured_git_name
      changed_when: false
      failed_when: false

    - name: Configure the Git name
      ansible.builtin.command:
        argv: [git, config, --global, user.name, "{{ ops_git_user_name }}"]
      when: configured_git_name.stdout != ops_git_user_name

    - name: Read the configured Git email
      ansible.builtin.command:
        argv: [git, config, --global, --get, user.email]
      register: configured_git_email
      changed_when: false
      failed_when: false

    - name: Configure the Git email
      ansible.builtin.command:
        argv: [git, config, --global, user.email, "{{ ops_git_user_email }}"]
      when: configured_git_email.stdout != ops_git_user_email

    - name: Ensure the Ops SSH directory exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.ssh"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: "0700"

    - name: Install repository-managed public keys on Ops
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.ssh/authorized_keys"
        line: "{{ lookup('file', item) | trim }}"
        create: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: "0600"
      loop: "{{ repository_authorized_key_files }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Generate the Ops management key if absent
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -f
          - "{{ ansible_user_dir }}/.ssh/id_ed25519"
          - -N
          - ""
          - -C
          - ops-management
        creates: "{{ ansible_user_dir }}/.ssh/id_ed25519"

    - name: Read the Ops management public key
      ansible.builtin.slurp:
        src: "{{ ansible_user_dir }}/.ssh/id_ed25519.pub"
      register: ops_management_public_key_file

    - name: Retain the public key for the managed hosts
      ansible.builtin.set_fact:
        ops_management_public_key: >-
          {{ ops_management_public_key_file.content | b64decode | trim }}

    - name: Remove previous managed VM SSH host keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -f
          - "{{ ansible_user_dir }}/.ssh/known_hosts"
          - -R
          - "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['managed_vms'] | reject('equalto', 'ops') | list }}"
      register: removed_managed_vm_host_keys
      changed_when: "'found' in removed_managed_vm_host_keys.stdout"
      failed_when: false

    - name: Scan managed VM SSH host keys
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - -T
          - "5"
          - "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['managed_vms'] | reject('equalto', 'ops') | list }}"
      register: managed_vm_host_keys
      changed_when: false
      failed_when: false

    - name: Select reachable managed VMs
      ansible.builtin.add_host:
        name: "{{ item.item }}"
        groups: ops_ssh_bootstrap_targets
      loop: "{{ managed_vm_host_keys.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc == 0 and (item.stdout | length) > 0

    - name: Trust managed VM SSH host keys
      ansible.builtin.known_hosts:
        path: "{{ ansible_user_dir }}/.ssh/known_hosts"
        name: "{{ hostvars[item.item].ansible_host }}"
        key: "{{ item.stdout }}"
        state: present
      loop: "{{ managed_vm_host_keys.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc == 0 and (item.stdout | length) > 0

- name: Authorize Ops on every running managed VM
  hosts: ops_ssh_bootstrap_targets
  gather_facts: true
  vars:
    repository_authorized_key_files: >-
      {{ query('fileglob', playbook_dir ~ '/../../keys/*.pub') | sort }}

  tasks:
    - name: Ensure the managed user's SSH directory exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.ssh"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: "0700"

    - name: Install the Ops management public key
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.ssh/authorized_keys"
        line: "{{ hostvars['ops'].ops_management_public_key }}"
        create: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: "0600"

    - name: Install repository-managed public keys
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.ssh/authorized_keys"
        line: "{{ lookup('file', item) | trim }}"
        create: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: "0600"
      loop: "{{ repository_authorized_key_files }}"
      loop_control:
        label: "{{ item | basename }}"

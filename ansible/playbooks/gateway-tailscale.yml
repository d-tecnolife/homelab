---
- name: Configure Gateway as the homelab Tailscale subnet router
  hosts: localhost
  gather_facts: false
  vars:
    gateway_tailscale_secret_path: "{{ playbook_dir }}/../secrets/gateway.sops.env"

  tasks:
    - name: Require encrypted Gateway API and Tailscale enrollment input
      ansible.builtin.stat:
        path: "{{ gateway_tailscale_secret_path }}"
      register: gateway_tailscale_secret
      tags: [always]

    - name: Refuse to configure Gateway without encrypted credentials
      ansible.builtin.assert:
        that: gateway_tailscale_secret.stat.isreg | default(false)
        fail_msg: >-
          Create and encrypt ansible/secrets/gateway.sops.env first.
      tags: [always]

    - name: Decrypt Gateway credentials in memory
      ansible.builtin.command:
        argv: [sops, decrypt, "{{ gateway_tailscale_secret_path }}"]
      register: gateway_tailscale_secret_content
      changed_when: false
      no_log: true
      tags: [always]

    - name: Extract Gateway API and enrollment values
      ansible.builtin.set_fact:
        gateway_url: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^OPNSENSE_URL=(.+)$', '\\1') | first | trim }}"
        gateway_api_key: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^OPNSENSE_API_KEY=(.+)$', '\\1') | first | trim }}"
        gateway_api_secret: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^OPNSENSE_API_SECRET=(.+)$', '\\1') | first | trim }}"
        gateway_tailscale_auth_key: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^TAILSCALE_AUTH_KEY=(.+)$', '\\1') | first | trim }}"
      no_log: true
      tags: [always]

    - name: Require complete Gateway API and enrollment values
      ansible.builtin.assert:
        that:
          - gateway_url | length > 0
          - gateway_api_key | length > 0
          - gateway_api_secret | length > 0
          - gateway_tailscale_auth_key | length > 0
        fail_msg: gateway.sops.env is incomplete.
      no_log: true
      tags: [always]

    # Git-over-SSH is a permanent VLAN-wide capability for current and future
    # guests. It still excludes every private destination.
    - name: Find declarative public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=100&searchPhrase={{ item.description | urlencode }}"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      loop:
        - { interface: lan, description: "Public Git SSH - Infra" }
        - { interface: opt1, description: "Public Git SSH - Internal" }
        - { interface: opt2, description: "Public Git SSH - DMZ" }
      register: gateway_public_git_ssh_rules
      changed_when: false
      no_log: true
      tags: [git_ssh]

    - name: Declare absent public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "90"
            action: pass
            quick: "1"
            interface: "{{ item.item.interface }}"
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: "{{ item.item.interface }}"
            destination_net: "!private_networks"
            destination_port: "22"
            description: "{{ item.item.description }}"
      loop: "{{ gateway_public_git_ssh_rules.results }}"
      when: (item.json.rows | default([]) | length) == 0
      register: gateway_public_git_ssh_rules_added
      no_log: true
      tags: [git_ssh]

    - name: Apply the Gateway firewall policy when public Git SSH was added
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/apply"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: gateway_public_git_ssh_rules_added.results | selectattr('changed') | list | length > 0
      no_log: true
      tags: [git_ssh]

    - name: Install the OPNsense Tailscale plugin through the seeded Gateway API
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/firmware/install/os-tailscale"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_install
      no_log: true

    - name: Wait for the OPNsense firmware job that installs Tailscale
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/firmware/upgradestatus"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_install_status
      until: gateway_tailscale_install_status.json.status | default('running') != 'running'
      retries: 60
      delay: 5
      changed_when: false
      no_log: true

    - name: Require successful OPNsense Tailscale plugin installation
      ansible.builtin.assert:
        that: gateway_tailscale_install_status.json.status | default('error') == 'done'
        fail_msg: >-
          OPNsense failed to install os-tailscale. Inspect the firmware log in
          the Gateway web UI before retrying.
      no_log: true

    - name: Wait for the OPNsense Tailscale plugin API
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/get"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_plugin
      until: gateway_tailscale_plugin.status == 200
      retries: 12
      delay: 5
      no_log: true

    - name: Configure Tailscale authentication on Gateway
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/authentication/set"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          authentication:
            loginServer: https://controlplane.tailscale.com
            preAuthKey: "{{ gateway_tailscale_auth_key }}"
      no_log: true

    - name: Configure Gateway Tailscale subnet routing
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/set"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          settings:
            enabled: "1"
            loginTimeout: "10"
            listenPort: "41641"
            acceptDNS: "0"
            advertiseExitNode: "0"
            acceptSubnetRoutes: "0"
            enableSSH: "0"
            disableSNAT: "0"
      no_log: true

    - name: Read existing Gateway Tailscale subnet advertisements
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/search_subnet"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
      register: gateway_tailscale_existing_subnets
      changed_when: false
      no_log: true

    - name: Remove previous Gateway Tailscale subnet advertisements
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/del_subnet/{{ item.uuid }}"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
      loop: "{{ gateway_tailscale_existing_subnets.json.rows | default([]) }}"
      no_log: true

    - name: Declare Gateway Tailscale subnet advertisements
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/add_subnet"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          subnet4:
            subnet: "{{ item.subnet }}"
            description: "{{ item.description }}"
      loop:
        - subnet: 172.16.10.0/24
          description: Infra
        - subnet: 172.16.20.0/24
          description: Internal
        - subnet: 172.16.30.0/24
          description: DMZ
      no_log: true

    - name: Apply Gateway Tailscale configuration
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/service/reconfigure"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
      no_log: true

    - name: Require Gateway Tailscale service to be running
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/service/status"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: gateway_tailscale_status
      changed_when: false
      no_log: true

    - name: Assert Gateway Tailscale service reports running
      ansible.builtin.assert:
        that: >-
          gateway_tailscale_status.json.status | default('') in ['running', 'ok']
        fail_msg: Gateway did not report a running Tailscale service.
      no_log: true

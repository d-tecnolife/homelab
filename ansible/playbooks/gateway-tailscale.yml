---
- name: Configure Gateway as the homelab Tailscale subnet router
  hosts: localhost
  gather_facts: false
  vars:
    gateway_tailscale_secret_path: "{{ playbook_dir }}/../secrets/gateway.sops.env"

  tasks:
    - name: Require encrypted Gateway API and Tailscale enrollment input
      ansible.builtin.stat:
        path: "{{ gateway_tailscale_secret_path }}"
      register: gateway_tailscale_secret
      tags: [always]

    - name: Refuse to configure Gateway without encrypted credentials
      ansible.builtin.assert:
        that: gateway_tailscale_secret.stat.isreg | default(false)
        fail_msg: >-
          Create and encrypt ansible/secrets/gateway.sops.env first.
      tags: [always]

    - name: Decrypt Gateway credentials in memory
      ansible.builtin.command:
        argv: [sops, decrypt, "{{ gateway_tailscale_secret_path }}"]
      register: gateway_tailscale_secret_content
      changed_when: false
      no_log: true
      tags: [always]

    - name: Extract Gateway API and enrollment values
      ansible.builtin.set_fact:
        gateway_url: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^OPNSENSE_URL=(.+)$', '\\1') | first | trim }}"
        gateway_api_key: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^OPNSENSE_API_KEY=(.+)$', '\\1') | first | trim }}"
        gateway_api_secret: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^OPNSENSE_API_SECRET=(.+)$', '\\1') | first | trim }}"
        gateway_tailscale_oauth_client_id: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^TAILSCALE_OAUTH_CLIENT_ID=(.+)$', '\\1') | first | trim }}"
        gateway_tailscale_oauth_client_secret: "{{ gateway_tailscale_secret_content.stdout | regex_search('(?m)^TAILSCALE_OAUTH_CLIENT_SECRET=(.+)$', '\\1') | first | trim }}"
      no_log: true
      tags: [always]

    - name: Require complete Gateway API and enrollment values
      ansible.builtin.assert:
        that:
          - gateway_url | length > 0
          - gateway_api_key | length > 0
          - gateway_api_secret | length > 0
          - gateway_tailscale_oauth_client_id | length > 0
          - gateway_tailscale_oauth_client_secret | length > 0
        fail_msg: gateway.sops.env is incomplete.
      no_log: true
      tags: [always]

    - name: Exchange the Tailscale OAuth client for a short-lived API token
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/oauth/token
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ gateway_tailscale_oauth_client_id }}"
          client_secret: "{{ gateway_tailscale_oauth_client_secret }}"
          grant_type: client_credentials
        status_code: 200
      register: gateway_tailscale_oauth_token
      no_log: true
      tags: [always]

    - name: Mint a single-use tagged Tailscale auth key for Gateway
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/tailnet/-/keys
        method: POST
        headers:
          Authorization: "Bearer {{ gateway_tailscale_oauth_token.json.access_token }}"
        body_format: json
        body:
          capabilities:
            devices:
              create:
                reusable: false
                ephemeral: false
                preauthorized: true
                tags: ["tag:gateway"]
          expirySeconds: 3600
        status_code: 200
      register: gateway_tailscale_minted_key
      no_log: true
      tags: [always]

    - name: Extract the minted Tailscale auth key
      ansible.builtin.set_fact:
        gateway_tailscale_auth_key: "{{ gateway_tailscale_minted_key.json.key }}"
      no_log: true
      tags: [always]

    # Git-over-SSH is a permanent VLAN-wide capability for current and future
    # guests. It still excludes every private destination.
    - name: Find declarative public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=100&searchPhrase={{ item.description | urlencode }}"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      loop:
        - { interface: lan, description: "Public Git SSH - Infra" }
        - { interface: opt1, description: "Public Git SSH - Internal" }
        - { interface: opt2, description: "Public Git SSH - DMZ" }
      register: gateway_public_git_ssh_rules
      changed_when: false
      no_log: true
      tags: [git_ssh]

    - name: Declare absent public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "90"
            action: pass
            quick: "1"
            interface: "{{ item.item.interface }}"
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: "{{ item.item.interface }}"
            destination_net: "!private_networks"
            destination_port: "22"
            description: "{{ item.item.description }}"
      loop: "{{ gateway_public_git_ssh_rules.results }}"
      when: (item.json.rows | default([]) | length) == 0
      register: gateway_public_git_ssh_rules_added
      no_log: true
      tags: [git_ssh]

    - name: Apply the Gateway firewall policy when public Git SSH was added
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/apply"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: gateway_public_git_ssh_rules_added.results | selectattr('changed') | list | length > 0
      no_log: true
      tags: [git_ssh]

    - name: Trigger OPNsense firmware check to refresh package metadata
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/firmware/check"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_firmware_check
      changed_when: true
      no_log: true
    
    - name: Wait for the OPNsense firmware check job to complete
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/firmware/upgradestatus"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_firmware_check_status
      until: gateway_firmware_check_status.json.status | default('running') != 'running'
      retries: 60
      delay: 5
      changed_when: false
      no_log: true
    
    - name: Require successful OPNsense firmware metadata refresh
      ansible.builtin.assert:
        that: gateway_firmware_check_status.json.status | default('error') == 'done'
        fail_msg: >-
          OPNsense firmware metadata refresh failed. Verify Gateway DNS and
          upstream repository connectivity before retrying.
      no_log: true

    - name: Install the OPNsense Tailscale plugin through the seeded Gateway API
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/firmware/install/os-tailscale"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_install
      no_log: true

    - name: Wait for the OPNsense firmware job that installs Tailscale
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/firmware/upgradestatus"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_install_status
      until: gateway_tailscale_install_status.json.status | default('running') != 'running'
      retries: 60
      delay: 5
      changed_when: false
      no_log: true

    - name: Require successful OPNsense Tailscale plugin installation
      ansible.builtin.assert:
        that: gateway_tailscale_install_status.json.status | default('error') == 'done'
        fail_msg: >-
          OPNsense failed to install os-tailscale. Inspect the firmware log in
          the Gateway web UI before retrying.
      no_log: true

    # A freshly installed plugin's API routes are not registered until the web
    # GUI backend (lighttpd/PHP-FPM) restarts and reloads the MVC controller
    # map; without this, every /api/tailscale/* call 404s regardless of how
    # long the wait/retry loop below runs (reproduced live on a from-scratch
    # rebuild). Two earlier attempts at this exact task both used endpoints
    # that never existed (/api/core/system/restart/webgui, then
    # /api/core/service/reconfigure/webgui) and were abandoned within minutes
    # without ever being verified — see opnsense/core's actual
    # Core/Api/ServiceController.php, which only defines search/start/
    # restart/stop actions taking a service name, no "system" controller and
    # no "reconfigure" action. This is that real, verified restartAction.
    - name: Restart OPNsense Web GUI to register new API routes
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/core/service/restart/webgui"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      no_log: true

    - name: Wait for the OPNsense Tailscale plugin API
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/get"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_plugin
      until: gateway_tailscale_plugin.status == 200
      retries: 12
      delay: 5
      no_log: true

    - name: Configure Tailscale authentication on Gateway
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/authentication/set"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          authentication:
            loginServer: https://controlplane.tailscale.com
            preAuthKey: "{{ gateway_tailscale_auth_key }}"
      no_log: true

    - name: Configure Gateway Tailscale subnet routing
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/set"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          settings:
            enabled: "1"
            loginTimeout: "10"
            listenPort: "41641"
            acceptDNS: "0"
            advertiseExitNode: "0"
            acceptSubnetRoutes: "0"
            enableSSH: "0"
            disableSNAT: "0"
      no_log: true

    # The rendered /etc/rc.conf.d/tailscaled only sets tailscaled_enable=YES
    # when OPNsense.tailscale.settings.enabled is non-empty in config.xml
    # (see security/tailscale/.../templates/OPNsense/Tailscale/rc.conf.d in
    # opnsense/plugins). If settings/set above did not actually persist that
    # field, OPNsense's own service reconciliation stops tailscaled shortly
    # after the service/start call below reports success — the daemon looks
    # started, then dies, and status.BackendState reads "unavailable" with no
    # indication why. Catch that here instead of guessing from the symptom.
    - name: Verify Gateway Tailscale settings persisted as enabled
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/get"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_tailscale_settings_check
      no_log: true

    - name: Require settings.enabled to have actually persisted
      ansible.builtin.assert:
        that: gateway_tailscale_settings_check.json.settings.enabled | default('0') == '1'
        fail_msg: >-
          OPNsense settings/get reports settings.enabled did not persist as
          "1" after settings/set. The generated rc.conf.d will read
          tailscaled_enable=NO regardless of what service/reconfigure or
          service/start report; do not proceed until this is fixed upstream
          in the plugin or worked around here.
      no_log: true

    - name: Read existing Gateway Tailscale subnet advertisements
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/search_subnet"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
      register: gateway_tailscale_existing_subnets
      changed_when: false
      no_log: true

    - name: Remove previous Gateway Tailscale subnet advertisements
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/del_subnet/{{ item.uuid }}"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
      loop: "{{ gateway_tailscale_existing_subnets.json.rows | default([]) }}"
      no_log: true

    - name: Declare Gateway Tailscale subnet advertisements
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/settings/add_subnet"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          subnet4:
            subnet: "{{ item.subnet }}"
            description: "{{ item.description }}"
      loop:
        - subnet: 172.16.10.0/24
          description: Infra
        - subnet: 172.16.20.0/24
          description: Internal
        - subnet: 172.16.30.0/24
          description: DMZ
      no_log: true

    # This mirrors the plugin's own GUI exactly, verified against its actual
    # frontend source (security/tailscale/src/opnsense/mvc/app/views/
    # OPNsense/Tailscale/{settings,authentication}.volt): both tabs' Apply
    # button does nothing but POST the form to its `set` endpoint, then POST
    # to this same /api/tailscale/service/reconfigure. There is no separate
    # start call anywhere in the real, working, user-facing flow. Earlier
    # revisions of this playbook added an explicit service/start call
    # (43ea58d) and later a switch to settings/reload (8d0beeb/c261a18),
    # neither grounded in how the plugin is actually driven in production;
    # both were guesses that happened to look plausible and neither fixed
    # the live failure. Do not reintroduce either without first checking
    # this same source for what changed.
    - name: Apply Gateway Tailscale configuration
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/service/reconfigure"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
      no_log: true

    - name: Read Gateway Tailscale daemon status
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/tailscale/status/status"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: gateway_tailscale_status
      until: gateway_tailscale_status.json.BackendState | default('') == 'Running'
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false
      no_log: true

    - name: Assert Gateway Tailscale service reports running
      ansible.builtin.assert:
        that: >-
          gateway_tailscale_status.json.BackendState | default('') == 'Running'
        fail_msg: >-
          Gateway Tailscale BackendState is
          {{ gateway_tailscale_status.json.BackendState | default('unavailable') }}.

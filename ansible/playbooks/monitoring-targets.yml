---
- name: Generate Prometheus targets from inventory
  hosts: monitoring
  become: true
  gather_facts: false
  tasks:
    - name: Require the Proxmox hardware metrics target
      ansible.builtin.assert:
        that:
          - groups.get('proxmox_hosts', []) | length > 0
        fail_msg: >-
          Add the Proxmox host to the proxmox_hosts inventory group before
          generating node exporter targets. Hardware temperatures are collected
          directly from that host.

    - name: Create generated Prometheus target directory
      ansible.builtin.file:
        path: /srv/compose/monitoring/prometheus-targets
        state: directory
        owner: root
        group: prometheus-data
        mode: "2770"

    - name: Render all node exporter targets
      ansible.builtin.template:
        src: ../files/prometheus/node-targets.yml.j2
        dest: /srv/compose/monitoring/prometheus-targets/node-targets.yml
        owner: root
        group: prometheus-data
        mode: "0644"

    - name: Render Minecraft metrics target
      ansible.builtin.template:
        src: ../files/prometheus/minecraft-targets.yml.j2
        dest: /srv/compose/monitoring/prometheus-targets/minecraft-targets.yml
        owner: root
        group: prometheus-data
        mode: "0644"

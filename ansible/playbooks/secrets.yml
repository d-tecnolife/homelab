---
- name: Install the homelab secrets foundation on Ops
  hosts: ops
  become: true
  gather_facts: true
  vars:
    sops_version: "3.13.3"
    secrets_operator_user: "{{ ansible_user }}"
    secrets_operator_home: "/home/{{ secrets_operator_user }}"
    sops_age_key_file: "{{ secrets_operator_home }}/.config/sops/age/keys.txt"
    sops_age_recovery_source: ""
    repository_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Require a supported Ops architecture
      ansible.builtin.assert:
        that: ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: "The SOPS installer supports only x86_64 and aarch64 Ops hosts."

    - name: Select the SOPS release architecture
      ansible.builtin.set_fact:
        sops_release_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

    - name: Install age
      ansible.builtin.apt:
        name: age
        state: present
        update_cache: true

    - name: Install the pinned SOPS release with checksum verification
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.{{ sops_release_arch }}"
        dest: /usr/local/bin/sops
        owner: root
        group: root
        mode: "0755"
        checksum: "sha256:https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.checksums.txt"

    - name: Find encrypted secrets already committed to the repository
      ansible.builtin.find:
        paths: "{{ repository_root }}"
        recurse: true
        file_type: file
        use_regex: true
        patterns:
          - ".*\\.sops\\.(env|ya?ml|json)$"
      delegate_to: localhost
      become: false
      register: committed_sops_files

    - name: Check for an existing Ops age identity
      ansible.builtin.stat:
        path: "{{ sops_age_key_file }}"
      register: existing_sops_age_identity

    - name: Require recovery material when encrypted secrets already exist
      ansible.builtin.assert:
        that: >-
          existing_sops_age_identity.stat.isreg | default(false) or
          sops_age_recovery_source | length > 0 or
          committed_sops_files.matched == 0
        fail_msg: >-
          Encrypted secrets already exist, but the matching age identity is
          absent. Restore it and rerun with
          -e sops_age_recovery_source=/path/to/keys.txt. Generating a new key
          would not decrypt the existing repository.

    - name: Create the operator age directory
      ansible.builtin.file:
        path: "{{ sops_age_key_file | dirname }}"
        state: directory
        owner: "{{ secrets_operator_user }}"
        group: "{{ secrets_operator_user }}"
        mode: "0700"

    - name: Restore the age identity during recovery
      ansible.builtin.copy:
        src: "{{ sops_age_recovery_source }}"
        dest: "{{ sops_age_key_file }}"
        owner: "{{ secrets_operator_user }}"
        group: "{{ secrets_operator_user }}"
        mode: "0600"
        force: false
      no_log: true
      when: sops_age_recovery_source | length > 0

    - name: Generate the Ops age identity once
      ansible.builtin.command:
        argv:
          - age-keygen
          - -o
          - "{{ sops_age_key_file }}"
        creates: "{{ sops_age_key_file }}"
      become_user: "{{ secrets_operator_user }}"
      no_log: true
      when: sops_age_recovery_source | length == 0

    - name: Protect the Ops age identity
      ansible.builtin.file:
        path: "{{ sops_age_key_file }}"
        owner: "{{ secrets_operator_user }}"
        group: "{{ secrets_operator_user }}"
        mode: "0600"

    - name: Read the public age recipient
      ansible.builtin.command:
        argv:
          - age-keygen
          - -y
          - "{{ sops_age_key_file }}"
      become_user: "{{ secrets_operator_user }}"
      register: sops_age_recipient
      changed_when: false

    - name: Verify the age identity decrypts every committed secret
      ansible.builtin.command:
        argv:
          - sops
          - decrypt
          - --output
          - /dev/null
          - "{{ item.path }}"
      environment:
        SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
      become_user: "{{ secrets_operator_user }}"
      loop: "{{ committed_sops_files.files }}"
      loop_control:
        label: "{{ item.path | relpath(repository_root) }}"
      changed_when: false
      no_log: true

    - name: Show the public recipient and recovery reminder
      ansible.builtin.debug:
        msg:
          - "Public age recipient: {{ sops_age_recipient.stdout }}"
          - "Back up {{ sops_age_key_file }} outside the homelab before encrypting secrets."
          - "Copy .sops.yaml.example to .sops.yaml, replace its placeholder, and commit .sops.yaml."

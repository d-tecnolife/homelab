---
- name: Deploy Compose stacks
  hosts: ops:apps:games:monitoring
  become: true
  gather_facts: false
  vars:
    compose_stacks_by_host:
      ops: []
      apps:
        - authentik
        - job-ops
        - playwright
        - vault
        - vaultwarden
        - watchtower
      monitoring:
        - monitoring
      games: []
    compose_stacks: "{{ compose_stacks_by_host[inventory_hostname] }}"
    compose_data_directories_by_host:
      ops: []
      apps:
        - authentik/postgresql
        - authentik/media
        - authentik/custom-templates
        - job-ops/data
        - playwright/data
        - vault/data
        - vaultwarden/data
      monitoring:
        - monitoring/prometheus
        - monitoring/prometheus-targets
        - monitoring/alertmanager
        - monitoring/loki
        - monitoring/grafana
      games: []
    compose_data_directories: >-
      {{ compose_data_directories_by_host[inventory_hostname] }}
    compose_data_owners_by_host:
      ops: []
      apps:
        - {path: playwright/data, owner: "1001"}
        - {path: authentik/postgresql, owner: "70"}
        - {path: authentik/media, owner: "1000"}
        - {path: authentik/custom-templates, owner: "1000"}
        - {path: vault/data, owner: "100"}
      monitoring:
        - {path: monitoring/prometheus, owner: "65534"}
        # Owned by the Prometheus container UID so it can read its targets
        # without depending on a data group's creation-order GID.
        - {path: monitoring/prometheus-targets, owner: "65534"}
        - {path: monitoring/alertmanager, owner: "65534"}
        - {path: monitoring/loki, owner: "10001"}
        - {path: monitoring/grafana, owner: "472"}
      games: []
    compose_data_owners: "{{ compose_data_owners_by_host[inventory_hostname] }}"
    compose_data_access_by_host:
      ops: []
      apps:
        - {path: playwright/data, group: playwright-data}
        - {path: authentik/postgresql, group: authentik-data}
        - {path: authentik/media, group: authentik-data}
        - {path: authentik/custom-templates, group: authentik-data}
        - {path: job-ops/data, group: job-ops-data}
        - {path: vault/data, group: vault-data}
        - {path: vaultwarden/data, group: vaultwarden-data}
      monitoring:
        - {path: monitoring/prometheus, group: prometheus-data}
        - {path: monitoring/prometheus-targets, group: prometheus-data}
        - {path: monitoring/alertmanager, group: alertmanager-data}
        - {path: monitoring/loki, group: loki-data}
        - {path: monitoring/grafana, group: grafana-data}
      games: []
    compose_data_access: "{{ compose_data_access_by_host[inventory_hostname] }}"
    service_operator_users: [dtec]
    compose_secret_directory: "{{ playbook_dir }}/../../secrets/compose"
    sops_age_key_file: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') | default(lookup('env', 'HOME') ~ '/.config/sops/age/keys.txt', true) }}"

  tasks:
    - name: Create service data access groups
      ansible.builtin.group:
        name: "{{ item.group }}"
        state: present
      loop: "{{ compose_data_access }}"

    - name: Add operators to service data access groups
      ansible.builtin.user:
        name: "{{ item.1 }}"
        groups: "{{ item.0.group }}"
        append: true
      loop: "{{ compose_data_access | product(service_operator_users) | list }}"
      loop_control:
        label: "{{ item.1 }} -> {{ item.0.group }}"

    - name: Create stack directories
      ansible.builtin.file:
        path: "/opt/compose/{{ item }}"
        state: directory
        owner: root
        group: docker
        mode: "2775"
      loop: "{{ compose_stacks }}"

    - name: Create persistent data directories
      ansible.builtin.file:
        path: "/srv/compose/{{ item }}"
        state: directory
        owner: root
        group: docker
        mode: "2775"
      loop: >-
        {{ compose_data_directories |
           difference(compose_data_owners | map(attribute='path') | list) }}

    - name: Allow non-root containers to write persistent data
      ansible.builtin.file:
        path: "/srv/compose/{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: docker
        mode: "2770"
      loop: "{{ compose_data_owners }}"

    - name: Grant operators access to existing service data
      ansible.posix.acl:
        path: "/srv/compose/{{ item.path }}"
        entity: "{{ item.group }}"
        etype: group
        permissions: rwX
        recursive: true
        state: present
      loop: "{{ compose_data_access }}"

    - name: Inherit operator access on new service data
      ansible.posix.acl:
        path: "/srv/compose/{{ item.path }}"
        entity: "{{ item.group }}"
        etype: group
        permissions: rwX
        default: true
        state: present
      loop: "{{ compose_data_access }}"

    - name: Copy version-controlled stack files
      ansible.builtin.copy:
        src: "../../compose/{{ item }}/"
        dest: "/opt/compose/{{ item }}/"
        owner: root
        group: docker
        mode: "0644"
        directory_mode: "0755"
      loop: "{{ compose_stacks }}"
      register: compose_stack_files

    - name: Check for encrypted stack secrets
      ansible.builtin.stat:
        path: "{{ compose_secret_directory }}/{{ item }}.sops.env"
      loop: "{{ compose_stacks }}"
      delegate_to: localhost
      become: false
      register: compose_secret_files

    - name: Check for stack secret examples
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../compose/{{ item }}/.env.example"
      loop: "{{ compose_stacks }}"
      delegate_to: localhost
      become: false
      register: compose_secret_examples

    # Without this the stack deploys with no .env and Docker Compose fails much
    # later on "required variable X is missing a value", which does not name the
    # missing repository input.
    - name: Require an encrypted input for every stack that declares variables
      ansible.builtin.assert:
        that: item.1.stat.isreg | default(false)
        fail_msg: >-
          {{ item.0.item }} declares environment variables in
          compose/{{ item.0.item }}/.env.example but has no
          secrets/compose/{{ item.0.item }}.sops.env. Create and encrypt it from
          the example before deploying; see secrets/README.md.
      loop: "{{ compose_secret_examples.results | zip(compose_secret_files.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when:
        - item.0.stat.isreg | default(false)
        # A comment-only example declares nothing and needs no encrypted input:
        # vault, for instance, is initialised by hand.
        # Matching on the file's presence alone would block both for no reason.
        - lookup('file', item.0.stat.path).splitlines() | map('trim')
          | reject('match', '#') | select('search', '=') | list | length > 0

    - name: Decrypt stack secrets in memory
      ansible.builtin.command:
        argv:
          - sops
          - decrypt
          - "{{ item.stat.path }}"
      environment:
        SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
      loop: "{{ compose_secret_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isreg | default(false)
      delegate_to: localhost
      become: false
      register: compose_decrypted_secrets
      changed_when: false
      no_log: true

    - name: Install decrypted stack secrets
      ansible.builtin.copy:
        dest: "/opt/compose/{{ item.item.item }}/.env"
        owner: root
        group: docker
        mode: "0640"
        content: "{{ item.stdout | trim }}\n"
      loop: "{{ compose_decrypted_secrets.results }}"
      loop_control:
        label: "{{ item.item.item | default('skipped') }}"
      when: not (item.skipped | default(false))
      no_log: true

    - name: Validate Compose stacks
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "/opt/compose/{{ item }}"
          - config
          - --quiet
      loop: "{{ compose_stacks }}"
      changed_when: false

    - name: Let Vaultwarden use Compose-managed SSO settings
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            path = "/srv/compose/vaultwarden/data/config.json"
            changed = False
            try:
                with open(path, "r+", encoding="utf-8") as config_file:
                    config = json.load(config_file)
                    sso_keys = [key for key in config if key.startswith("sso_")]
                    if not sso_keys:
                        sys.exit(0)
                    for key in sso_keys:
                        del config[key]
                    config_file.seek(0)
                    json.dump(config, config_file, indent=2, sort_keys=True)
                    config_file.write("\n")
                    config_file.truncate()
                    changed = True
            except FileNotFoundError:
                pass
            sys.exit(10 if changed else 0)
      when:
        - inventory_hostname == 'apps'
        - "'vaultwarden' in compose_stacks"
      register: vaultwarden_sso_config
      changed_when: vaultwarden_sso_config.rc == 10
      failed_when: vaultwarden_sso_config.rc not in [0, 10]

    - name: Pull and apply Compose stacks
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "/opt/compose/{{ item }}"
          - up
          - --detach
          - --pull
          - always
          - --remove-orphans
      loop: "{{ compose_stacks }}"
      register: compose_deployments
      changed_when: >-
        'Created' in (compose_deployments.stdout + compose_deployments.stderr) or
        'Recreated' in (compose_deployments.stdout + compose_deployments.stderr) or
        'Started' in (compose_deployments.stdout + compose_deployments.stderr) or
        'Pulled' in (compose_deployments.stdout + compose_deployments.stderr)

    # Compose recreates a container only when its definition changes, not when a
    # bind-mounted config file does, so new alert rules or scrape jobs would
    # otherwise wait for an unrelated restart.
    - name: Reload Prometheus after its configuration changes
      ansible.builtin.command:
        argv: [docker, kill, --signal, HUP, prometheus]
      when:
        - inventory_hostname == 'monitoring'
        - compose_stack_files.results
          | selectattr('item', 'equalto', 'monitoring')
          | selectattr('changed') | list | length > 0
      changed_when: true

    - name: Restart Vaultwarden after clearing SSO overrides
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - /opt/compose/vaultwarden
          - up
          - --detach
          - --force-recreate
      when:
        - vaultwarden_sso_config is defined
        - vaultwarden_sso_config.changed
      changed_when: true

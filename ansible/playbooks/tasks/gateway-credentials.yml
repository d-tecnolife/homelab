---
- name: Extract Gateway API values
  ansible.builtin.set_fact:
    gateway_url: "{{ sops_input_content.stdout | regex_findall('(?m)^OPNSENSE_URL=(.*)$') | first | default('') | trim }}"
    gateway_api_key: "{{ sops_input_content.stdout | regex_findall('(?m)^OPNSENSE_API_KEY=(.*)$') | first | default('') | trim }}"
    gateway_api_secret: "{{ sops_input_content.stdout | regex_findall('(?m)^OPNSENSE_API_SECRET=(.*)$') | first | default('') | trim }}"
  no_log: true

- name: Require complete Gateway API values
  ansible.builtin.assert:
    that:
      - gateway_url | length > 0
      - gateway_api_key | length > 0
      - gateway_api_secret | length > 0
    fail_msg: gateway.sops.env is incomplete.
  no_log: true

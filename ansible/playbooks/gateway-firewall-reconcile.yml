---
# Defensive reconciliation for firewall rules that are also hand-rendered
# into the bootstrap ISO's config.xml (see config/gateway.yaml and
# scripts/gateway/render-opnsense-config.py). Firewall rules, unlike
# Unbound's versioned MVC model, take effect correctly when hand-rendered
# (confirmed: Gateway's rule enforcement has worked correctly all along),
# so this only matters if a rule was later removed independently of a
# rebuild (e.g. manual GUI edit).
- name: Reconcile Gateway firewall rules, aliases and port forwards
  hosts: localhost
  gather_facts: false
  vars:
    gateway_secret_path: "{{ playbook_dir }}/../../secrets/gateway.sops.env"
    # A double-quoted YAML scalar yields a real newline, which is how the alias
    # API separates multiple values.
    gateway_newline: "\n"
    # Port forwards come straight from the catalog the ISO is rendered from.
    # Before this, a forward added to config/gateway.yaml after install (voice
    # chat's UDP 24454) reached only future rebuilds, never the live Gateway.
    gateway_catalog: "{{ lookup('file', playbook_dir ~ '/../../config/gateway.yaml') | from_yaml }}"
    # Same mapping as INTERFACES in render-opnsense-config.py.
    gateway_interface_devices: {infra: lan, internal: opt1, dmz: opt2, wan: wan}
    # Aliases a rule below depends on. Each is created when absent and its
    # members corrected when they differ from this declaration.
    gateway_declared_aliases:
      - {name: exporter_ports, type: port, members: [9100, 9150], description: "Monitoring exporter ports"}
      - {name: proxmox, type: host, members: [192.168.1.100], description: "Proxmox host"}
      - {name: internal_app_tcp_ports, type: port, members: [465, 587, 993, 2053, 2083, 2087, 2096, 3478, 5349, 8443], description: "Internal public app TCP egress"}
      - {name: internal_app_udp_ports, type: port, members: [443, 3478, "19294:19344", "50000:65535"], description: "Internal public app UDP egress"}

  tasks:
    - name: Load the encrypted input
      ansible.builtin.import_tasks: tasks/load-sops-input.yml
      vars:
        sops_input_path: "{{ gateway_secret_path }}"
        sops_input_missing_message: >-
          Create and encrypt secrets/gateway.sops.env first.
      tags: [always]

    - name: Extract and validate Gateway credentials
      ansible.builtin.import_tasks: tasks/gateway-credentials.yml
      tags: [always]

    # A rule may only reference an alias that already exists, and OPNsense's rule
    # model takes one port, a range, or a port alias -- never a comma-joined
    # list. Gateways installed before that was known carry "9100,9150" on the
    # exporter rule, so the alias has to exist before the rule can be repaired.
    # An existing alias whose members differ is corrected too: this used to
    # create absent aliases only, so exporter_ports kept a retired 9150 member.
    - name: Read the current Gateway aliases
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/alias/search_item?rowCount=500"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_aliases
      changed_when: false
      check_mode: false
      no_log: true

    - name: Declare absent aliases
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/alias/add_item"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          alias:
            enabled: "1"
            name: "{{ item.name }}"
            type: "{{ item.type }}"
            # "members", not "values": Jinja resolves item.values to the
            # dictionary's own .values() method before the key, which is a
            # templating error that failed_when cannot suppress.
            content: "{{ item.members | join(gateway_newline) }}"
            description: "{{ item.description }}"
      loop: "{{ gateway_declared_aliases }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        gateway_aliases.json.rows | default([])
        | selectattr('name', 'equalto', item.name) | list | length == 0
      register: gateway_aliases_added
      changed_when: false
      failed_when: false
      no_log: true

    # The alias API returns members as newline-separated text.
    - name: Correct aliases whose members drifted
      ansible.builtin.uri:
        url: >-
          {{ gateway_url }}/api/firewall/alias/set_item/{{
            (gateway_aliases.json.rows | selectattr('name', 'equalto', item.name) | list)[0].uuid }}
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          alias:
            enabled: "1"
            name: "{{ item.name }}"
            type: "{{ item.type }}"
            content: "{{ item.members | join(gateway_newline) }}"
            description: "{{ item.description }}"
      loop: "{{ gateway_declared_aliases }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - (gateway_aliases.json.rows | default([]) | selectattr('name', 'equalto', item.name) | list) | length > 0
        - >-
          ((gateway_aliases.json.rows | selectattr('name', 'equalto', item.name) | list)[0].content | string).split(gateway_newline)
          | map('trim') | reject('equalto', '') | sort | list
          != (item.members | map('string') | sort | list)
      register: gateway_aliases_corrected
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept each added or corrected alias
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected alias {{ item.item.name | default('?') }}:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: "{{ gateway_aliases_added.results + gateway_aliases_corrected.results }}"
      loop_control:
        label: "{{ item.item.name | default('alias') }}"
      when: not (item.skipped | default(false))

    - name: Load added or corrected aliases before any rule references them
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/alias/reconfigure"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: >-
        (gateway_aliases_added.results + gateway_aliases_corrected.results)
        | rejectattr('skipped', 'defined') | list | length > 0
      no_log: true

    # Git-over-SSH and NTS key exchange are permanent VLAN-wide capabilities for
    # current and future guests; Internal also has common app egress. They all
    # exclude every private destination. This runs after alias reconciliation
    # because the app egress rules reference port aliases.
    - name: Find declarative public egress firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=500&searchPhrase={{ item.description | urlencode }}"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      loop:
        - { interface: lan, port: "22", description: "Public Git SSH - Infra" }
        - { interface: opt1, port: "22", description: "Public Git SSH - Internal" }
        - { interface: opt2, port: "22", description: "Public Git SSH - DMZ" }
        - { interface: lan, port: "4460", description: "Public NTS key exchange - Infra" }
        - { interface: opt1, port: "4460", description: "Public NTS key exchange - Internal" }
        - { interface: opt2, port: "4460", description: "Public NTS key exchange - DMZ" }
        - { interface: opt1, protocol: TCP, port: internal_app_tcp_ports, description: "Public app egress TCP - Internal" }
        - { interface: opt1, protocol: UDP, port: internal_app_udp_ports, description: "Public app egress UDP - Internal" }
      register: gateway_public_egress_rules
      changed_when: false
      no_log: true

    - name: Declare absent public egress firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "90"
            action: pass
            quick: "1"
            interface: "{{ item.item.interface }}"
            direction: in
            ipprotocol: inet
            protocol: "{{ item.item.protocol | default('TCP') }}"
            source_net: "{{ item.item.interface }}"
            # The API rejects a "!"-prefixed alias; negation is its own field,
            # exactly as render-opnsense-config.py writes it for a fresh install.
            destination_net: private_networks
            destination_not: "1"
            destination_port: "{{ item.item.port }}"
            description: "{{ item.item.description }}"
      loop: "{{ gateway_public_egress_rules.results }}"
      # searchPhrase is not an exact-description filter: the API returns other
      # rows too, so "any row came back" skipped every absent rule. Match the
      # description exactly, as the reconciled-rule tasks below do.
      when: >-
        item.json.rows | default([])
        | selectattr('description', 'equalto', item.item.description)
        | list | length == 0
      register: gateway_public_egress_rules_added
      # OPNsense answers 200 even when it rejects a rule, reporting
      # {"result": "failed", "validations": {...}} in the body; the assert below
      # checks each response. A per-item changed_when cannot see its own
      # response (item is the search result), so it never reported a saved rule
      # and the apply gate stayed shut: rules were saved but not loaded. The
      # apply gate counts attempted additions instead.
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept each public egress rule
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected a public egress rule:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: "{{ gateway_public_egress_rules_added.results }}"
      loop_control:
        label: "{{ item.item.item.description | default('rule') }}"
      when: not (item.skipped | default(false))

    # Ops' own administration path to Gateway. An installer built before the
    # renderer learned OPNsense's (self) token and its single-port rule model
    # left these enabled but unmatchable, which is invisible from the GUI: the
    # built-in anti-lockout rule keeps 443 working while SSH times out.
    # This repair checks destination and port drift only. When either differs,
    # it writes the declared body below. Full baseline reconciliation requires
    # API normalization and regression coverage before widening this check.
    - name: Read the current Gateway filter rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=500"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_rules
      changed_when: false
      # Read-only; the correction, addition and retirement tasks all consume it.
      check_mode: false
      no_log: true

    - name: Declare the rules whose destination and port are reconciled
      ansible.builtin.set_fact:
        gateway_reconciled_rules:
          - enabled: "1"
            sequence: "140"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: ops
            destination_net: "(self)"
            destination_port: "22"
            description: Ops Gateway administration
          - enabled: "1"
            sequence: "141"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: ops
            destination_net: "(self)"
            destination_port: "443"
            description: Ops Gateway HTTPS administration
          # sequence is omitted on purpose: set_rule leaves unsupplied fields
          # untouched, so the rule keeps its rendered position.
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: monitoring
            destination_net: homelab_networks
            destination_port: exporter_ports
            description: Monitoring exporters
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: ops
            destination_net: proxmox
            destination_port: "22"
            description: Ops Proxmox administration
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: monitoring
            destination_net: proxmox
            destination_port: "9100"
            description: Monitoring Proxmox node exporter
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: monitoring
            destination_net: proxmox
            destination_port: "8006"
            description: Monitoring Proxmox API exporter

    - name: Correct drifted reconciled rules
      ansible.builtin.uri:
        url: >-
          {{ gateway_url }}/api/firewall/filter/set_rule/{{
            (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list)[0].uuid }}
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ item }}"
      loop: "{{ gateway_reconciled_rules }}"
      loop_control:
        label: "{{ item.description }}"
      when:
        - (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list) | length > 0
        - (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list)[0].destination_net != item.destination_net
          or (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list)[0].destination_port != item.destination_port
      register: gateway_administration_corrected
      # The apply gate below is driven from the saved results instead, because a
      # per-item changed_when cannot see its own iteration's response.
      changed_when: false
      failed_when: false
      no_log: true

    - name: Declare absent reconciled rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ item }}"
      loop: "{{ gateway_reconciled_rules }}"
      loop_control:
        label: "{{ item.description }}"
      when: (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list) | length == 0
      register: gateway_administration_added
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept every reconciled rule it was sent
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected {{ item.item.description | default('a reconciled rule') }}:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: >-
        {{ (gateway_administration_corrected.results | default([]))
           + (gateway_administration_added.results | default([])) }}
      loop_control:
        label: "{{ item.item.description | default('rule') }}"
      when: not (item.skipped | default(false))

    # Port aliases are expanded into the generated rules, so a corrected alias
    # needs the filter reloaded as well as the alias tables.
    - name: Apply the Gateway firewall policy when a rule or alias was added or corrected
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/apply"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: >-
        (gateway_public_egress_rules_added.results | rejectattr('skipped', 'defined') | list | length > 0)
        or (((gateway_administration_corrected.results | default([]))
             + (gateway_administration_added.results | default([])))
            | rejectattr('skipped', 'defined') | list | length > 0)
        or ((gateway_aliases_corrected.results | default([]))
            | rejectattr('skipped', 'defined') | list | length > 0)
      no_log: true

    # Forwards are matched by description, like the reconciled filter rules
    # above. Each declared field is compared, so a forward edited in the GUI
    # (wrong target, reflection turned on, disabled) is written back too.
    # Undeclared forwards are left alone rather than deleted.
    - name: Declare the port forwards from the Gateway catalog
      ansible.builtin.set_fact:
        gateway_declared_forwards: >-
          {{ gateway_declared_forwards | default([]) + [{
               'sequence': (gateway_forward_index + 1) | string,
               'disabled': '0',
               'interface': gateway_interface_devices[item.interface],
               'ipprotocol': 'inet',
               'protocol': item.protocol | lower,
               'destination': {'network': 'wanip', 'port': item.destination_port | string, 'not': '0'},
               'target': item.target,
               'local-port': item.target_port | string,
               'descr': item.description,
               'natreflection': 'disable',
               'pass': 'pass'}] }}
      loop: "{{ gateway_catalog.firewall.port_forwards }}"
      loop_control:
        index_var: gateway_forward_index
        label: "{{ item.description }}"

    - name: Read the current Gateway port forwards
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/d_nat/search_rule?rowCount=500"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_forwards
      changed_when: false
      check_mode: false
      no_log: true

    # search_rule flattens the model into dotted keys ("destination.port").
    - name: Correct drifted port forwards
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/d_nat/set_rule/{{ gateway_forward_live.uuid }}"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ item }}"
      vars:
        gateway_forward_live: >-
          {{ (gateway_forwards.json.rows | selectattr('descr', 'equalto', item.descr) | list + [{}])[0] }}
      loop: "{{ gateway_declared_forwards }}"
      loop_control:
        label: "{{ item.descr }}"
      when:
        - gateway_forward_live.uuid is defined
        - >-
          [gateway_forward_live.disabled, gateway_forward_live.interface,
           gateway_forward_live.protocol | lower, gateway_forward_live['destination.network'],
           gateway_forward_live['destination.port'], gateway_forward_live.target,
           gateway_forward_live['local-port'], gateway_forward_live.natreflection,
           gateway_forward_live.pass]
          != [item.disabled, item.interface, item.protocol, item.destination.network,
              item.destination.port, item.target, item['local-port'], item.natreflection,
              item.pass]
      register: gateway_forwards_corrected
      changed_when: false
      failed_when: false
      no_log: true

    - name: Declare absent port forwards
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/d_nat/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ item }}"
      loop: "{{ gateway_declared_forwards }}"
      loop_control:
        label: "{{ item.descr }}"
      when: >-
        gateway_forwards.json.rows | default([])
        | selectattr('descr', 'equalto', item.descr) | list | length == 0
      register: gateway_forwards_added
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept each added or corrected port forward
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected port forward {{ item.item.descr | default('?') }}:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: "{{ gateway_forwards_corrected.results + gateway_forwards_added.results }}"
      loop_control:
        label: "{{ item.item.descr | default('forward') }}"
      when: not (item.skipped | default(false))

    # Port forwards have their own apply endpoint; filter/apply does not load them.
    - name: Apply port forwards when one was added or corrected
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/d_nat/apply"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: >-
        (gateway_forwards_corrected.results + gateway_forwards_added.results)
        | rejectattr('skipped', 'defined') | list | length > 0
      changed_when: true
      no_log: true

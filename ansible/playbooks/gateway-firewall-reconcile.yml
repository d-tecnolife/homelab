---
# Defensive reconciliation for firewall rules that are also hand-rendered
# into the bootstrap ISO's config.xml (see gateway/baseline.yaml and
# scripts/gateway/render-opnsense-config.py). Firewall rules, unlike
# Unbound's versioned MVC model, take effect correctly when hand-rendered
# (confirmed: Gateway's rule enforcement has worked correctly all along),
# so this only matters if a rule was later removed independently of a
# rebuild (e.g. manual GUI edit). Extracted from the retired
# gateway-tailscale.yml, which bundled this with Tailscale-specific tasks
# for no clear reason -- the two are unrelated.
- name: Reconcile Gateway's public Git SSH firewall rules
  hosts: localhost
  gather_facts: false
  vars:
    gateway_secret_path: "{{ playbook_dir }}/../secrets/gateway.sops.env"

  tasks:
    - name: Require encrypted Gateway API input
      ansible.builtin.stat:
        path: "{{ gateway_secret_path }}"
      register: gateway_secret
      tags: [always]

    - name: Refuse to configure Gateway without encrypted credentials
      ansible.builtin.assert:
        that: gateway_secret.stat.isreg | default(false)
        fail_msg: >-
          Create and encrypt ansible/secrets/gateway.sops.env first.
      tags: [always]

    - name: Decrypt Gateway credentials in memory
      ansible.builtin.command:
        argv: [sops, decrypt, "{{ gateway_secret_path }}"]
      register: gateway_secret_content
      changed_when: false
      no_log: true
      tags: [always]

    - name: Extract Gateway API values
      ansible.builtin.set_fact:
        gateway_url: "{{ gateway_secret_content.stdout | regex_search('(?m)^OPNSENSE_URL=(.+)$', '\\1') | first | trim }}"
        gateway_api_key: "{{ gateway_secret_content.stdout | regex_search('(?m)^OPNSENSE_API_KEY=(.+)$', '\\1') | first | trim }}"
        gateway_api_secret: "{{ gateway_secret_content.stdout | regex_search('(?m)^OPNSENSE_API_SECRET=(.+)$', '\\1') | first | trim }}"
      no_log: true
      tags: [always]

    - name: Require complete Gateway API values
      ansible.builtin.assert:
        that:
          - gateway_url | length > 0
          - gateway_api_key | length > 0
          - gateway_api_secret | length > 0
        fail_msg: gateway.sops.env is incomplete.
      no_log: true
      tags: [always]

    # Git-over-SSH is a permanent VLAN-wide capability for current and future
    # guests. It still excludes every private destination.
    - name: Find declarative public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=100&searchPhrase={{ item.description | urlencode }}"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      loop:
        - { interface: lan, description: "Public Git SSH - Infra" }
        - { interface: opt1, description: "Public Git SSH - Internal" }
        - { interface: opt2, description: "Public Git SSH - DMZ" }
      register: gateway_public_git_ssh_rules
      changed_when: false
      no_log: true

    - name: Declare absent public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "90"
            action: pass
            quick: "1"
            interface: "{{ item.item.interface }}"
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: "{{ item.item.interface }}"
            destination_net: "!private_networks"
            destination_port: "22"
            description: "{{ item.item.description }}"
      loop: "{{ gateway_public_git_ssh_rules.results }}"
      when: (item.json.rows | default([]) | length) == 0
      register: gateway_public_git_ssh_rules_added
      # OPNsense answers 200 even when it rejects a rule, reporting
      # {"result": "failed", "validations": {...}} in the body. Without this
      # the playbook reports success having changed nothing.
      changed_when: (item.json.result | default('')) == 'saved'
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept each public Git SSH rule
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected a public Git SSH rule:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: "{{ gateway_public_git_ssh_rules_added.results }}"
      loop_control:
        label: "{{ item.item.item.description | default('rule') }}"
      when: not (item.skipped | default(false))

    # Ops' own administration path to Gateway. An installer built before the
    # renderer learned OPNsense's (self) token left this rule enabled but
    # unmatchable, which is invisible from the GUI: port 443 keeps working
    # through the built-in LAN anti-lockout rule while SSH silently times out.
    # The rule is fully declared in gateway/baseline.yaml, so reconciling it
    # means replacing the whole body rather than preserving live fields.
    - name: Find the declarative Ops Gateway administration rule
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=100&searchPhrase={{ 'Ops Gateway administration' | urlencode }}"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_administration_rule
      changed_when: false
      no_log: true

    - name: Select the Ops Gateway administration rule needing repair
      ansible.builtin.set_fact:
        gateway_administration_matches: >-
          {{ gateway_administration_rule.json.rows | default([])
             | selectattr('description', 'equalto', 'Ops Gateway administration')
             | list }}
      no_log: true

    - name: Declare the Ops Gateway administration rule body
      ansible.builtin.set_fact:
        gateway_administration_body:
          enabled: "1"
          sequence: "140"
          action: pass
          quick: "1"
          interface: lan
          direction: in
          ipprotocol: inet
          protocol: TCP
          source_net: ops
          destination_net: "(self)"
          destination_port: "22"
          description: Ops Gateway administration
      no_log: true

    - name: Correct an unmatchable Ops Gateway administration rule
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/set_rule/{{ gateway_administration_matches[0].uuid }}"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ gateway_administration_body }}"
      when:
        - gateway_administration_matches | length > 0
        - gateway_administration_matches[0].destination_net != '(self)'
      register: gateway_administration_rule_corrected
      changed_when: (gateway_administration_rule_corrected.json.result | default('')) == 'saved'
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept the corrected administration rule
      ansible.builtin.assert:
        that: (gateway_administration_rule_corrected.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected the corrected administration rule:
          {{ gateway_administration_rule_corrected.json.validations
             | default(gateway_administration_rule_corrected.json | default('no response')) }}
      when: not (gateway_administration_rule_corrected.skipped | default(false))

    - name: Declare an absent Ops Gateway administration rule
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ gateway_administration_body }}"
      when: gateway_administration_matches | length == 0
      register: gateway_administration_rule_added
      changed_when: (gateway_administration_rule_added.json.result | default('')) == 'saved'
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept the added administration rule
      ansible.builtin.assert:
        that: (gateway_administration_rule_added.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected the added administration rule:
          {{ gateway_administration_rule_added.json.validations
             | default(gateway_administration_rule_added.json | default('no response')) }}
      when: not (gateway_administration_rule_added.skipped | default(false))

    - name: Apply the Gateway firewall policy when a rule was added or corrected
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/apply"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: >-
        (gateway_public_git_ssh_rules_added.results | selectattr('changed') | list | length > 0)
        or (gateway_administration_rule_corrected.changed | default(false))
        or (gateway_administration_rule_added.changed | default(false))
      no_log: true

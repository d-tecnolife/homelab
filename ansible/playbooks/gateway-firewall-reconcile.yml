---
# Defensive reconciliation for firewall rules that are also hand-rendered
# into the bootstrap ISO's config.xml (see gateway/baseline.yaml and
# scripts/gateway/render-opnsense-config.py). Firewall rules, unlike
# Unbound's versioned MVC model, take effect correctly when hand-rendered
# (confirmed: Gateway's rule enforcement has worked correctly all along),
# so this only matters if a rule was later removed independently of a
# rebuild (e.g. manual GUI edit).
- name: Reconcile Gateway firewall rules and aliases
  hosts: localhost
  gather_facts: false
  vars:
    gateway_secret_path: "{{ playbook_dir }}/../secrets/gateway.sops.env"
    # A double-quoted YAML scalar yields a real newline, which is how the alias
    # API separates multiple values.
    gateway_newline: "\n"

  tasks:
    - name: Load the encrypted input
      ansible.builtin.import_tasks: tasks/load-sops-input.yml
      vars:
        sops_input_path: "{{ gateway_secret_path }}"
        sops_input_missing_message: >-
          Create and encrypt ansible/secrets/gateway.sops.env first.
      tags: [always]

    - name: Extract and validate Gateway credentials
      ansible.builtin.import_tasks: tasks/gateway-credentials.yml
      tags: [always]

    # Git-over-SSH is a permanent VLAN-wide capability for current and future
    # guests. It still excludes every private destination.
    - name: Find declarative public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=100&searchPhrase={{ item.description | urlencode }}"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      loop:
        - { interface: lan, description: "Public Git SSH - Infra" }
        - { interface: opt1, description: "Public Git SSH - Internal" }
        - { interface: opt2, description: "Public Git SSH - DMZ" }
      register: gateway_public_git_ssh_rules
      changed_when: false
      no_log: true

    - name: Declare absent public Git SSH firewall rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule:
            enabled: "1"
            sequence: "90"
            action: pass
            quick: "1"
            interface: "{{ item.item.interface }}"
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: "{{ item.item.interface }}"
            destination_net: "!private_networks"
            destination_port: "22"
            description: "{{ item.item.description }}"
      loop: "{{ gateway_public_git_ssh_rules.results }}"
      when: (item.json.rows | default([]) | length) == 0
      register: gateway_public_git_ssh_rules_added
      # OPNsense answers 200 even when it rejects a rule, reporting
      # {"result": "failed", "validations": {...}} in the body. Without this
      # the playbook reports success having changed nothing.
      changed_when: (item.json.result | default('')) == 'saved'
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept each public Git SSH rule
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected a public Git SSH rule:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: "{{ gateway_public_git_ssh_rules_added.results }}"
      loop_control:
        label: "{{ item.item.item.description | default('rule') }}"
      when: not (item.skipped | default(false))

    # A rule may only reference an alias that already exists, and OPNsense's rule
    # model takes one port, a range, or a port alias -- never a comma-joined
    # list. Gateways installed before that was known carry "9100,9150" on the
    # exporter rule, so the alias has to exist before the rule can be repaired.
    - name: Read the current Gateway aliases
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/alias/search_item?rowCount=500"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_aliases
      changed_when: false
      check_mode: false
      no_log: true

    - name: Declare absent aliases
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/alias/add_item"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          alias:
            enabled: "1"
            name: "{{ item.name }}"
            type: "{{ item.type }}"
            # "members", not "values": Jinja resolves item.values to the
            # dictionary's own .values() method before the key, which is a
            # templating error that failed_when cannot suppress.
            content: "{{ item.members | join(gateway_newline) }}"
            description: "{{ item.description }}"
      loop:
        - {name: exporter_ports, type: port, members: [9100], description: "Monitoring exporter ports"}
        - {name: proxmox, type: host, members: [192.168.1.100], description: "Proxmox host"}
      loop_control:
        label: "{{ item.name }}"
      when: >-
        gateway_aliases.json.rows | default([])
        | selectattr('name', 'equalto', item.name) | list | length == 0
      register: gateway_aliases_added
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept each added alias
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected alias {{ item.item.name | default('?') }}:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: "{{ gateway_aliases_added.results }}"
      loop_control:
        label: "{{ item.item.name | default('alias') }}"
      when: not (item.skipped | default(false))

    - name: Load added aliases before any rule references them
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/alias/reconfigure"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: gateway_aliases_added.results | rejectattr('skipped', 'defined') | list | length > 0
      no_log: true

    # Ops' own administration path to Gateway. An installer built before the
    # renderer learned OPNsense's (self) token and its single-port rule model
    # left these enabled but unmatchable, which is invisible from the GUI: the
    # built-in anti-lockout rule keeps 443 working while SSH times out.
    # This repair checks destination and port drift only. When either differs,
    # it writes the declared body below. Full baseline reconciliation requires
    # API normalization and regression coverage before widening this check.
    - name: Read the current Gateway filter rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/search_rule?current=1&rowCount=500"
        method: GET
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: gateway_rules
      changed_when: false
      # Read-only; the correction, addition and retirement tasks all consume it.
      check_mode: false
      no_log: true

    - name: Declare the rules whose destination and port are reconciled
      ansible.builtin.set_fact:
        gateway_reconciled_rules:
          - enabled: "1"
            sequence: "140"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: ops
            destination_net: "(self)"
            destination_port: "22"
            description: Ops Gateway administration
          - enabled: "1"
            sequence: "141"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: ops
            destination_net: "(self)"
            destination_port: "443"
            description: Ops Gateway HTTPS administration
          # sequence is omitted on purpose: set_rule leaves unsupplied fields
          # untouched, so the rule keeps its rendered position.
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: monitoring
            destination_net: homelab_networks
            destination_port: exporter_ports
            description: Monitoring exporters
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: ops
            destination_net: proxmox
            destination_port: "22"
            description: Ops Proxmox administration
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: monitoring
            destination_net: proxmox
            destination_port: "9100"
            description: Monitoring Proxmox node exporter
          - enabled: "1"
            action: pass
            quick: "1"
            interface: lan
            direction: in
            ipprotocol: inet
            protocol: TCP
            source_net: monitoring
            destination_net: proxmox
            destination_port: "8006"
            description: Monitoring Proxmox API exporter

    - name: Correct drifted reconciled rules
      ansible.builtin.uri:
        url: >-
          {{ gateway_url }}/api/firewall/filter/set_rule/{{
            (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list)[0].uuid }}
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ item }}"
      loop: "{{ gateway_reconciled_rules }}"
      loop_control:
        label: "{{ item.description }}"
      when:
        - (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list) | length > 0
        - (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list)[0].destination_net != item.destination_net
          or (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list)[0].destination_port != item.destination_port
      register: gateway_administration_corrected
      # The apply gate below is driven from the saved results instead, because a
      # per-item changed_when cannot see its own iteration's response.
      changed_when: false
      failed_when: false
      no_log: true

    - name: Declare absent reconciled rules
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/add_rule"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        body_format: json
        body:
          rule: "{{ item }}"
      loop: "{{ gateway_reconciled_rules }}"
      loop_control:
        label: "{{ item.description }}"
      when: (gateway_rules.json.rows | selectattr('description', 'equalto', item.description) | list) | length == 0
      register: gateway_administration_added
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the Gateway to accept every reconciled rule it was sent
      ansible.builtin.assert:
        that: (item.json.result | default('')) == 'saved'
        fail_msg: >-
          Gateway rejected {{ item.item.description | default('a reconciled rule') }}:
          {{ item.json.validations | default(item.json | default('no response')) }}
      loop: >-
        {{ (gateway_administration_corrected.results | default([]))
           + (gateway_administration_added.results | default([])) }}
      loop_control:
        label: "{{ item.item.description | default('rule') }}"
      when: not (item.skipped | default(false))

    - name: Apply the Gateway firewall policy when a rule was added or corrected
      ansible.builtin.uri:
        url: "{{ gateway_url }}/api/firewall/filter/apply"
        method: POST
        user: "{{ gateway_api_key }}"
        password: "{{ gateway_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      when: >-
        (gateway_public_git_ssh_rules_added.results | selectattr('changed') | list | length > 0)
        or (((gateway_administration_corrected.results | default([]))
             + (gateway_administration_added.results | default([])))
            | rejectattr('skipped', 'defined') | list | length > 0)
      no_log: true

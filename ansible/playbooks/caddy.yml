---
- name: Configure Caddy on Caddy
  hosts: caddy
  become: true
  gather_facts: true
  vars:
    service_operator_users: [dtec]
    caddy_operator_group: caddy-data
    caddy_encrypted_secret_path: "{{ playbook_dir }}/../secrets/caddy.sops.env"
    caddy_legacy_secret_path: "{{ playbook_dir }}/../secrets/caddy.env"
    sops_age_key_file: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') | default(lookup('env', 'HOME') ~ '/.config/sops/age/keys.txt', true) }}"
    cloudflare_zone_name: dscim.dev
    vault_dns_name: ssh-ca.dscim.dev
    vault_dns_address: "{{ ansible_host }}"

  pre_tasks:
    - name: Check for the encrypted Cloudflare secret
      ansible.builtin.stat:
        path: "{{ caddy_encrypted_secret_path }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: caddy_encrypted_secret

    - name: Check for the legacy plaintext Cloudflare secret
      ansible.builtin.stat:
        path: "{{ caddy_legacy_secret_path }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: caddy_legacy_secret

    - name: Require a Cloudflare secret
      ansible.builtin.assert:
        that: >-
          caddy_encrypted_secret.stat.isreg | default(false) or
          caddy_legacy_secret.stat.isreg | default(false)
        fail_msg: >-
          Create ansible/secrets/caddy.sops.env with SOPS. See
          secrets/README.md. The ignored ansible/secrets/caddy.env remains a
          temporary migration fallback.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Decrypt the Cloudflare secret in memory
      ansible.builtin.command:
        argv:
          - sops
          - decrypt
          - "{{ caddy_encrypted_secret_path }}"
      environment:
        SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: caddy_decrypted_secret
      changed_when: false
      no_log: true
      when: caddy_encrypted_secret.stat.isreg | default(false)

    - name: Read the legacy Cloudflare secret during migration
      ansible.builtin.set_fact:
        caddy_secret_content: >-
          {{ caddy_decrypted_secret.stdout
             if caddy_encrypted_secret.stat.isreg | default(false)
             else lookup('file', caddy_legacy_secret_path) }}
      run_once: true
      no_log: true

    - name: Extract the Cloudflare API token
      ansible.builtin.set_fact:
        cloudflare_api_token: >-
          {{ caddy_secret_content | trim | split('=', 1) | last }}
      run_once: true
      no_log: true

  tasks:
    - name: Find the Cloudflare zone
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones?name={{ cloudflare_zone_name }}&status=active"
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        return_content: true
        status_code: 200
      delegate_to: localhost
      become: false
      register: cloudflare_zone
      no_log: true

    - name: Require the Cloudflare zone
      ansible.builtin.assert:
        that: cloudflare_zone.json.result | length == 1
        fail_msg: "Cloudflare did not return exactly one active {{ cloudflare_zone_name }} zone."
      delegate_to: localhost
      become: false
      no_log: true

    - name: Find the Vault DNS record
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone.json.result[0].id }}/dns_records?type=A&name={{ vault_dns_name }}
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        return_content: true
        status_code: 200
      delegate_to: localhost
      become: false
      register: cloudflare_vault_record
      no_log: true

    - name: Publish the routed-subnet Vault DNS record
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone.json.result[0].id }}/dns_records{{
          '/' ~ cloudflare_vault_record.json.result[0].id if cloudflare_vault_record.json.result | length else '' }}
        method: "{{ 'PUT' if cloudflare_vault_record.json.result | length else 'POST' }}"
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        body_format: json
        body:
          type: A
          name: "{{ vault_dns_name }}"
          content: "{{ vault_dns_address }}"
          ttl: 1
          proxied: false
          comment: Routed-subnet Vault endpoint managed by Ansible
        status_code: 200
      delegate_to: localhost
      become: false
      no_log: true

    - name: Install Caddy prerequisites
      ansible.builtin.apt:
        name:
          - acl
          - caddy
        state: present
        update_cache: true

    - name: Create the Caddy data access group
      ansible.builtin.group:
        name: "{{ caddy_operator_group }}"
        state: present

    - name: Add operators to the Caddy data access group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ caddy_operator_group }}"
        append: true
      loop: "{{ service_operator_users }}"

    - name: Install Caddy with the Cloudflare DNS module
      ansible.builtin.get_url:
        url: "https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com/caddy-dns/cloudflare"
        dest: /usr/local/bin/caddy
        owner: root
        group: root
        mode: "0755"
        force: false
      notify: Restart Caddy

    - name: Verify the Cloudflare DNS module is installed
      ansible.builtin.command:
        argv:
          - /usr/local/bin/caddy
          - list-modules
          - --packages
      register: caddy_modules
      changed_when: false
      failed_when: "'dns.providers.cloudflare' not in caddy_modules.stdout"

    - name: Create Caddy configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /etc/caddy/sites
          owner: root
          group: caddy
          mode: "0750"
        - path: /var/log/caddy
          owner: caddy
          group: caddy
          mode: "0750"
        - path: /etc/systemd/system/caddy.service.d
          owner: root
          group: root
          mode: "0755"

    - name: Maintain Caddy log ownership
      ansible.builtin.file:
        path: /var/log/caddy
        state: directory
        owner: caddy
        group: caddy
        mode: "0750"
        recurse: true

    - name: Create the Job Ops Caddy access log
      ansible.builtin.file:
        path: /var/log/caddy/job-ops-access.json
        state: touch
        owner: caddy
        group: caddy
        mode: "0640"
        access_time: preserve
        modification_time: preserve

    - name: Grant operators access to existing Caddy logs
      ansible.posix.acl:
        path: /var/log/caddy
        entity: "{{ caddy_operator_group }}"
        etype: group
        permissions: rwX
        recursive: true
        state: present

    - name: Inherit operator access on new Caddy logs
      ansible.posix.acl:
        path: /var/log/caddy
        entity: "{{ caddy_operator_group }}"
        etype: group
        permissions: rwX
        default: true
        state: present

    - name: Install the Cloudflare API token
      ansible.builtin.copy:
        dest: /etc/caddy/cloudflare.env
        owner: root
        group: caddy
        mode: "0640"
        content: "{{ caddy_secret_content | trim }}\n"
      no_log: true
      notify: Restart Caddy

    - name: Configure systemd to use the custom Caddy build
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=/etc/caddy/cloudflare.env
          ExecStart=
          ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
          ExecReload=
          ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
      notify:
        - Restart Caddy

    - name: Load the Caddy systemd override
      ansible.builtin.systemd_service:
        daemon_reload: true
      changed_when: false

    - name: Install Caddy sites
      ansible.builtin.copy:
        src: ../files/caddy/sites/
        dest: /etc/caddy/sites/
        owner: root
        group: caddy
        directory_mode: "0750"
        mode: "0640"
      notify: Reload Caddy

    - name: Stage the Caddy configuration
      ansible.builtin.copy:
        src: ../files/caddy/Caddyfile
        dest: /tmp/Caddyfile.ansible
        owner: root
        group: root
        mode: "0644"
      changed_when: false

    - name: Validate the staged Caddy configuration
      ansible.builtin.command:
        argv:
          - /usr/local/bin/caddy
          - validate
          - --config
          - /tmp/Caddyfile.ansible
          - --adapter
          - caddyfile
          - --envfile
          - /etc/caddy/cloudflare.env
      become_user: caddy
      vars:
        # The default remote tmp is private to the SSH user; caddy needs its
        # own path when validating the configuration as the service account.
        ansible_remote_tmp: /tmp/ansible-caddy
      changed_when: false

    - name: Install the Caddy configuration
      ansible.builtin.copy:
        src: /tmp/Caddyfile.ansible
        dest: /etc/caddy/Caddyfile
        remote_src: true
        owner: root
        group: caddy
        mode: "0640"
      notify: Reload Caddy

    - name: Enable and start Caddy
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        state: started

    - name: Apply configuration changes before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify the private Caddy health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8082/healthz
        return_content: true
        status_code: 200
      register: caddy_health
      failed_when: caddy_health.content | trim != "ok"

  handlers:
    - name: Restart Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted

    - name: Reload Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted

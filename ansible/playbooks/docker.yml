---
- name: Configure Docker hosts
  hosts: ops:apps:games:monitoring
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true

    - name: Configure the official Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: [amd64]
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present
      register: docker_repository

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repository.changed }}"

    - name: Allow the management user to run Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create the Compose deployment root
      ansible.builtin.file:
        path: /opt/compose
        state: directory
        owner: root
        group: docker
        mode: "2775"

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Verify Docker Compose
      ansible.builtin.command:
        argv: [docker, compose, version]
      changed_when: false

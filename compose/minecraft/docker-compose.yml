services:
  minecraft:
    image: itzg/minecraft-server:java17
    container_name: minecraft
    restart: unless-stopped
    # The Forge pack does not answer the legacy status ping used by the image healthcheck.
    healthcheck:
      disable: true
    stop_grace_period: 2m
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: CURSEFORGE
      VERSION: "1.20.1"
      CF_SERVER_MOD: "https://mediafilez.forgecdn.net/files/8619/337/Craft%20to%20Exile%202%20SERVER-2.0.4.zip"
      # 6G, not 8G: the Games VM has 10 GB, and an 8 GB heap plus the JVM's own
      # overhead for this modpack left the guest about 85 MB free. It stalled on
      # memory a fifth of the time and re-read 3.3 TB from disk over two days,
      # starving sshd too. Raise this only together with the VM's memory.
      MEMORY: 6G
      MOTD: |-
        §d§lEVENT §f✦ §eDouble Backshots XP
        §7Lasts for all of §aSeptember§7!
      # No server icon: ICON pointed at /data/server-icon.png, which is personal
      # data this repository does not provide. The image aborts startup when the
      # file is absent, so a rebuild crash-looped Minecraft over a cosmetic option.
      # Place the file on the host and restore ICON/OVERRIDE_ICON to use one.
      USE_MEOWICE_FLAGS: "true"
      TZ: America/Winnipeg
      DIFFICULTY: normal
      LEVEL: Backshots Central
      OPS: |-
        ratcho19
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      SERVER_NAME: Backshots Central
      LOG_TIMESTAMP: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"
      MANAGEMENT_SERVER_ENABLED: "true"
      MANAGEMENT_SERVER_HOST: localhost
      MANAGEMENT_SERVER_PORT: "6767"
      MANAGEMENT_SERVER_ALLOWED_ORIGINS: localhost
      MANAGEMENT_SERVER_SECRET: "${MANAGEMENT_SERVER_SECRET:?set MANAGEMENT_SERVER_SECRET}"
    volumes:
      - /srv/compose/minecraft/data:/data

  minecraft-exporter:
    image: ghcr.io/dirien/minecraft-exporter:0.16.0
    container_name: minecraft-exporter
    restart: unless-stopped
    environment:
      MC_RCON_ADDRESS: minecraft:25575
      MC_RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"
      MC_WORLD: /minecraft/world
      MC_MOD_SERVER_STATS: forge
    ports:
      - "172.16.30.20:9150:9150"
    volumes:
      - /srv/compose/minecraft/data/Backshots Central:/minecraft/world:ro
    depends_on:
      - minecraft

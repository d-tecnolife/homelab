services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 2m
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      # Simple Voice Chat's own UDP channel -- separate from the game's TCP
      # port, and needs its own Gateway forward (config/gateway.yaml).
      - "24454:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      # A small vanilla-friendly QoL selection, not a heavy pack: the Games VM
      # has 10 GB, so this stays well clear of the memory-stall failure mode
      # the previous Forge modpack hit at 8G (see minecraft-backup.sh history).
      MEMORY: 4G
      # Required so dependencies like Cloth Config (needed by several mods'
      # config screens) get pulled in automatically instead of failing to
      # load at startup.
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      # Terralith changes world generation, so it only affects chunks
      # generated after it's installed. It's in the list from this server's
      # first boot, so the whole map generates with it -- do not remove it
      # later and expect old and new terrain to blend at the seam.
      MODRINTH_PROJECTS: |-
        fabric-api
        modmenu
        jade
        appleskin
        xaeros-minimap
        xaeros-world-map
        inventory-management
        fallingtree
        attributefix
        rei
        waystones
        carry-on
        travelersbackpack
        universal-graves
        elevator-mod
        building-wands
        upgrade-items
        bl4cks-sit
        terralith
        farmers-delight-refabricated
        macaws-furniture
        simple-voice-chat
        chat-heads
        ambientsounds
        presence-footsteps
        not-enough-animations
        sound-physics-remastered:beta
        better-mount-hud
        detail-armor-bar-reconstructed
        tool-stats
        ping-display
        lithium
        ferrite-core
        clumps
        krypton
        chunky
        servercore
      # Single-quoted so the \n reaches server.properties as a literal escape
      # (the second MOTD line); a real newline would break the properties file.
      MOTD: '§d§lEVENT §f✦ §eDouble Backshots XP\n§7Duration - §aFOREVER!!!!!!!'
      MAX_PLAYERS: "20"
      # Drop the image at /srv/compose/minecraft/data/server-icon.png on Games.
      ICON: /data/server-icon.png
      OVERRIDE_ICON: "TRUE"
      TZ: America/Winnipeg
      DIFFICULTY: normal
      LEVEL: world
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # WHITELIST intentionally not set: the image only touches whitelist.json
      # when this variable has a value, so leaving it unset means in-game
      # /whitelist add|remove (or RCON) is what manages the list, and it
      # persists across restarts undisturbed.
      LOG_TIMESTAMP: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"
      # Mod configs kept in the repo (./config) are copied over /data/config on
      # every start. The image skips a file when the copy in /data is newer by
      # default, which would silently ignore repo edits after a mod rewrites
      # its own config, so the repo always wins here.
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
    volumes:
      - /srv/compose/minecraft/data:/data
      # upgrader.json: Upgrade Items blacklist and value overrides that close
      # item-duplication exploits (ores, buckets, concrete, oxidized copper...).
      # xaero/lib/common.cfg: everyone_tracks_everyone, so all players show on
      # the world map. Edit these here, not in /data/config: it is overwritten.
      - ./config:/config:ro

  minecraft-exporter:
    image: ghcr.io/dirien/minecraft-exporter:0.16.0
    container_name: minecraft-exporter
    restart: unless-stopped
    environment:
      MC_RCON_ADDRESS: minecraft:25575
      MC_RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"
      MC_WORLD: /minecraft/data/world
    ports:
      - "172.16.30.20:9150:9150"
    volumes:
      # The data directory, not world/ itself: a bind source that is missing
      # (e.g. after deleting the world for a new seed) is created by Docker as
      # root:root 0755, and Minecraft then crash-loops on world/session.lock.
      - /srv/compose/minecraft/data:/minecraft/data:ro
    depends_on:
      - minecraft

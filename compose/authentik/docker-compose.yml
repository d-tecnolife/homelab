services:
  postgresql:
    image: postgres:16.11-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - /srv/compose/authentik/postgresql:/var/lib/postgresql/data

  server:
    image: ghcr.io/goauthentik/server:2026.8.1
    container_name: authentik-server
    restart: unless-stopped
    user: "1000:1000"
    command: server
    environment: &authentik_environment
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?set PG_PASS}
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 10.200.1.1/32
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "10.200.1.10:9000:9000"
    volumes:
      - /srv/compose/authentik/media:/media
      - /srv/compose/authentik/custom-templates:/templates
    depends_on:
      - postgresql

  worker:
    image: ghcr.io/goauthentik/server:2026.8.1
    container_name: authentik-worker
    restart: unless-stopped
    user: "1000:1000"
    command: worker
    environment: *authentik_environment
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - /srv/compose/authentik/media:/media
      - /srv/compose/authentik/custom-templates:/templates
    depends_on:
      - postgresql

services:
  wannbot:
    image: ghcr.io/d-tecnolife/wannbot:latest
    container_name: wannbot
    restart: unless-stopped
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro
      - ./.env:/app/.env:ro
    environment:
      - TZ=America/Winnipeg

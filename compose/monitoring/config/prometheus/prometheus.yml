global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/rules.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/node-targets.yml]
  - job_name: minecraft
    file_sd_configs:
      - files: [/etc/prometheus/minecraft-targets.yml]
  - job_name: proxmox
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: [192.168.1.100]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

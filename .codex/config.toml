model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[sandbox_workspace_write]
writable_roots = ["/home/dtec/notes"]

[agents]
enabled = true

[agents.architect]
description = "Exceptional-use architecture and design decisions with consequential cross-layer trade-offs."
